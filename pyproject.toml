# https://packaging.python.org/en/latest/specifications/pyproject-toml
# https://docs.astral.sh/uv/concepts/projects/config
#
# Aufruf:   uv sync --all-groups          Abhängigkeiten installieren, .venv anlegen
#           uv run buch                   Appserver starten
#           uv lock --upgrade             Lock-Datei aktualisieren
#           uv tree --outdated --depth=1  veraltete Packages anzeigen

[project]
name = "buch"
version = "2026.10.1"
description = "Buch mit Verlag (1:1) und Rezensionen (1:N): FastAPI, Pydantic, SQLAlchemy, PostgreSQL, uv"
readme = "README.md"
authors = [{ name = "Atay Özcan", email = "atay@oezcan.me" }]
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.159.1,<1.0.0",
    "psycopg[binary,pool]>=3.3.6,<4.0.0",
    "pydantic>=2.14.1,<3.0.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    "sqlalchemy>=2.1.6,<3.0.0",
    "uvicorn>=0.54.0,<1.0.0",
]

[project.scripts]
buch = "buch:main"

[build-system]
# https://docs.astral.sh/uv/concepts/build-backend
requires = ["uv_build>=0.12,<1.0.0"]
build-backend = "uv_build"

# https://docs.astral.sh/uv/reference/settings
[tool.uv]
required-version = ">=0.12"
# dev- und lint-Gruppe werden bei "uv sync" standardmäßig mitinstalliert
default-groups = "all"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.159.1,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.1.1,<10.0.0",
]
lint = [
    "ruff>=0.17.1,<1.0.0",
    "ty>=0.0.90,<1.0.0",
]

# https://docs.astral.sh/ruff/settings
#
#   uv run ruff check --preview [--fix] src tests
#   uv run ruff format --preview [--check] src tests
[tool.ruff]
preview = true
line-length = 88
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle (error)
    "W",     # pycodestyle (warning)
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (Sicherheit)
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "FLY",   # flynt
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "PL",    # Pylint
    "FURB",  # refurb
    "RUF",   # Ruff-spezifisch
    "TRY",   # tryceratops
    "FAST",  # FastAPI
]
ignore = [
    # Konflikt mit "multi-line-summary-first-line"
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # https://github.com/astral-sh/ruff/issues/9216
    "missing-trailing-comma",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert", "undocumented-public-function"]

# https://docs.astral.sh/ty/reference/configuration
#
#   uv run ty check src tests
[tool.ty.environment]
python = "./.venv"
root = ["./src", "./tests"]

[tool.ty.rules]
# https://docs.astral.sh/ty/reference/rules
possibly-unresolved-reference = "error"

# https://docs.pytest.org/en/stable/reference/customize.html
#
#   uv run pytest
[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-r A"
