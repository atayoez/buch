# https://packaging.python.org/en/latest/specifications/pyproject-toml
# https://docs.astral.sh/uv/concepts/projects/config
#
# Aufruf:   uv sync --all-groups          Abhängigkeiten installieren, .venv anlegen
#           uv run buch                   Appserver starten
#           uv lock --upgrade             Lock-Datei aktualisieren
#           uv tree --outdated --depth=1  veraltete Packages anzeigen

[project]
name = "buch"
version = "2026.10.1"
description = "Buch mit Verlag (1:1) und Rezensionen (1:N): FastAPI, Pydantic, SQLAlchemy, PostgreSQL, uv"
readme = "README.md"
authors = [{ name = "Atay Özcan", email = "atay@oezcan.me" }]
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.159.1,<1.0.0",
    "psycopg[binary,pool]>=3.3.6,<4.0.0",
    "pydantic>=2.14.1,<3.0.0",
    "sqlalchemy>=2.1.6,<3.0.0",
    "uvicorn>=0.54.0,<1.0.0",
]

[project.scripts]
buch = "buch:main"

[build-system]
# https://docs.astral.sh/uv/concepts/build-backend
requires = ["uv_build>=0.12,<1.0.0"]
build-backend = "uv_build"

# https://docs.astral.sh/uv/reference/settings
[tool.uv]
required-version = ">=0.12"
# dev- und lint-Gruppe werden bei "uv sync" standardmäßig mitinstalliert
default-groups = "all"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.159.1,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.1.1,<10.0.0",
]
lint = [
    "ruff>=0.17.1,<1.0.0",
    "ty>=0.0.90,<1.0.0",
]
