info:
  name: GET Vorhandene ID 1
  type: http
  seq: 1

http:
  method: GET
  url: "{{restUrl}}/:id"
  params:
    - name: id
      value: "1"
      type: path
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['etag']
      operator: isDefined
    - expression: res.body.verlag.name
      operator: eq
      value: dpunkt.verlag
    - expression: res.body.rezensionen
      operator: isArray
